
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.6
    container_name: keycloak-tp-test

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configurar contraseña local}

    volumes:
      - ./realm-tp-prog4-realm.json:/opt/keycloak/data/import/realm-tp-prog4-realm.json:ro

    command: start-dev --import-realm
